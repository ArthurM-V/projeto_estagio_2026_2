<div id="painel-medicos">
  <div>
    <p class="text-sm font-bold uppercase tracking-[0.18em] text-primary-700">Equipe</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">Gestão de médicos</h1>
    <p class="mt-3 text-sm leading-6 text-slate-600">Cadastre profissionais e acompanhe os acessos ao painel médico.</p>
  </div>
  <form method="get" action="{% url 'dashboard' %}" class="mt-6 flex flex-wrap items-end gap-3 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <div>
      <label for="situacao_medico" class="mb-1.5 block text-sm font-semibold text-slate-700">Situação</label>
      <select id="situacao_medico" name="situacao_medico" class="rounded-xl border border-slate-300 bg-white px-3.5 py-3 text-sm outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-primary-100">
        <option value="ativo" {% if situacao_medico == "ativo" %}selected{% endif %}>Ativos</option>
        <option value="desligado" {% if situacao_medico == "desligado" %}selected{% endif %}>Desligados</option>
      </select>
    </div>
    <button type="submit" class="rounded-xl bg-primary-600 px-5 py-3 text-sm font-bold text-white transition hover:bg-primary-700">Aplicar filtro</button>
  </form>
  <div class="mt-6 space-y-6">
    {% include "core/partials/medico_cadastro_form.html" %}
    {% include "core/partials/medicos_lista.html" %}
  </div>
</div>
