<section x-data class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"><div class="border-b border-slate-100 px-6 py-5"><h3 class="text-xl font-bold text-slate-900">Médicos cadastrados</h3></div><div class="overflow-x-auto"><table class="w-full text-left"><thead class="bg-slate-50 text-xs font-bold uppercase text-slate-500"><tr><th class="px-5 py-4">Médico</th><th class="px-5 py-4">Especialidade</th><th class="px-5 py-4">Acesso</th></tr></thead><tbody>{% for medico in medicos_equipe %}<tr class="border-t border-slate-100"><td class="px-5 py-4 font-semibold text-slate-800">Dr(a). {{ medico.nome }}</td><td class="px-5 py-4 text-sm text-slate-600">{{ medico.especialidade.nome }}</td><td class="px-5 py-4 text-sm">{% if medico.usuario %}<p>{{ medico.usuario.username }}</p><button type="button" @click="$dispatch('abrir-redefinicao', { nome: '{{ medico.nome|escapejs }}', url: '{% url 'redefinir_senha_medico' medico.id %}' })" class="mt-1 font-bold text-primary-700">Redefinir senha</button>{% else %}<span class="text-slate-500">Sem acesso</span>{% endif %}</td></tr>{% empty %}<tr><td colspan="3" class="px-5 py-10 text-center text-slate-500">Nenhum médico cadastrado.</td></tr>{% endfor %}</tbody></table></div></section>
