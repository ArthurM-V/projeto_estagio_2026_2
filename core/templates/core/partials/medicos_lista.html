<section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"><div class="border-b border-slate-100 px-6 py-5"><h3 class="text-xl font-bold text-slate-900">Médicos cadastrados</h3></div><div class="overflow-x-auto"><table class="w-full min-w-[760px] text-left"><thead class="bg-slate-50 text-xs font-bold uppercase text-slate-500"><tr><th class="px-5 py-4">Médico</th><th class="px-5 py-4">Especialidade</th><th class="px-5 py-4">Situação</th><th class="px-5 py-4">Ações</th></tr></thead><tbody>{% for medico in medicos_equipe %}<tr class="border-t border-slate-100"><td class="px-5 py-4"><p class="font-semibold text-slate-800">Dr(a). {{ medico.nome }}</p><p class="mt-1 text-sm text-slate-500">{{ medico.email }}</p></td><td class="px-5 py-4 text-sm text-slate-600">{{ medico.especialidade.nome }}</td><td class="px-5 py-4 text-sm">{% if medico.ativo %}<span class="rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-bold text-emerald-800">Ativo</span>{% else %}<span class="rounded-full bg-slate-200 px-2.5 py-1 text-xs font-bold text-slate-700">Desligado</span>{% endif %}</td><td class="px-5 py-4"><a href="{% url 'medico_administrativo_detail' medico.id %}" class="inline-flex rounded-lg px-3 py-2 text-sm font-bold text-primary-700 transition hover:bg-primary-50 hover:text-primary-800">Ver detalhes</a></td></tr>{% empty %}<tr><td colspan="4" class="px-5 py-10 text-center text-slate-500">Nenhum médico cadastrado.</td></tr>{% endfor %}</tbody></table></div></section>
