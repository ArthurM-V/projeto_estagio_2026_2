<div x-data="{ aberto: {% if medico_redefinicao %}true{% else %}false{% endif %}, nome: '{% if medico_redefinicao %}{{ medico_redefinicao.nome|escapejs }}{% endif %}', url: '{% if medico_redefinicao %}{% url 'redefinir_senha_medico' medico_redefinicao.id %}{% endif %}' }" @abrir-redefinicao.window="aberto = true; nome = $event.detail.nome; url = $event.detail.url" x-show="aberto" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 p-5" @keydown.escape.window="aberto = false"><div @click.outside="aberto = false" class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl"><p class="text-sm font-bold uppercase tracking-wider text-primary-700">Segurança</p><h3 class="mt-2 text-2xl font-bold text-slate-900">Redefinir senha de <span x-text="nome"></span></h3><p class="mt-3 text-sm text-slate-600">Confirme suas credenciais de superadmin para gerar uma nova senha.</p><form method="post" :action="url" class="mt-6">{% csrf_token %}{{ form_redefinicao.as_p }}<div class="mt-6 flex gap-3"><button type="button" @click="aberto = false" class="rounded-xl px-4 py-3 font-bold text-slate-600">Cancelar</button><button class="rounded-xl bg-primary-600 px-4 py-3 font-bold text-white">Confirmar redefinição</button></div></form></div></div>
