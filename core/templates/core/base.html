<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SmartHealth, cuidado médico próximo e agendamento de consultas online."
    />
    <title>{% block title %}SmartHealth{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#effaf8",
                100: "#d7f3ed",
                500: "#168b7a",
                600: "#0f7467",
                700: "#0b5d54",
                800: "#084a43",
              },
            },
            boxShadow: {
              soft: "0 12px 32px rgba(15, 116, 103, 0.10)",
            },
          },
        },
      };
    </script>
    <style>[x-cloak] { display: none !important; }</style>

    {% block extra_head %}{% endblock %}
  </head>

  <body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
    <div class="flex min-h-screen flex-col">
      {% block header %}{% endblock %}

      {% if messages %}
        <div class="pointer-events-none fixed inset-x-0 top-5 z-50 mx-auto flex max-w-md flex-col gap-3 px-5">
          {% for message in messages %}
            <div
              x-data="{ visivel: true }"
              x-show="visivel"
              x-transition
              class="pointer-events-auto flex items-start justify-between gap-3 rounded-xl border px-4 py-3 shadow-lg {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800{% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800{% else %}border-sky-200 bg-sky-50 text-sky-800{% endif %}"
              role="alert"
            >
              <p class="text-sm font-medium">{{ message }}</p>
              <button type="button" class="shrink-0 text-current opacity-70 hover:opacity-100" @click="visivel = false" aria-label="Fechar mensagem">×</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <main class="flex-1">
        {% block content %}{% endblock %}
      </main>

      {% block footer %}{% endblock %}
    </div>

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
