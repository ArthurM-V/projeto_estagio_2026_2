{% extends "core/base.html" %}

{% block title %}{{ status }} | SmartHealth{% endblock %}

{% block content %}
  <section class="flex min-h-screen items-center bg-slate-100 px-5 py-12">
    <div class="mx-auto w-full max-w-xl rounded-3xl bg-white p-8 text-center shadow-2xl sm:p-12">
      <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-primary-50 text-2xl font-bold text-primary-700" aria-hidden="true">!</span>
      <p class="mt-7 text-sm font-bold uppercase tracking-[0.2em] text-primary-700">Erro {{ status }}</p>
      <h1 class="mt-3 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">{{ titulo }}</h1>
      <p class="mx-auto mt-4 max-w-md text-sm leading-7 text-slate-600">{{ mensagem }}</p>
      <div class="mt-8 flex flex-col-reverse justify-center gap-3 sm:flex-row">
        <button type="button" onclick="window.history.back()" class="rounded-xl border border-slate-300 px-5 py-3 text-sm font-bold text-slate-700 transition hover:border-primary-600 hover:text-primary-700">Voltar</button>
        <a href="{% url 'home' %}" class="rounded-xl bg-primary-600 px-5 py-3 text-sm font-bold text-white transition hover:bg-primary-700">Ir para a página inicial</a>
      </div>
    </div>
  </section>
{% endblock %}
